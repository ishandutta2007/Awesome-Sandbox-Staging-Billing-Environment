<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glow-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .code-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      fill: #38bdf8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
    }

    /* CSS Animations for Dynamic Feel */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
      50% { opacity: 0.4; filter: drop-shadow(0 0 2px #10b981); }
    }

    .pulse-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 1050px 100px;
    }
    .pulse-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite reverse;
      transform-origin: 150px 240px;
    }
    .animated-wire {
      stroke-dasharray: 8 6;
      animation: flowLine 25s linear infinite;
    }
    .beacon {
      animation: statusBlink 2.2s ease-in-out infinite;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Technical Background Grid -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="100" y1="0" x2="100" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="500" y1="0" x2="500" y2="340" />
    <line x1="700" y1="0" x2="700" y2="340" />
    <line x1="900" y1="0" x2="900" y2="340" />
    <line x1="1100" y1="0" x2="1100" y2="340" />
  </g>

  <!-- Animated Ambient Glowing Orbs in the background -->
  <circle class="pulse-orb-1" cx="1060" cy="110" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle class="pulse-orb-2" cx="140" cy="240" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />

  <!-- Animated Dynamic Data Circuit Lines in background -->
  <path class="animated-wire" d="M 60 40 L 250 40 L 320 110 L 620 110" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3" />
  <path class="animated-wire" d="M 780 230 L 920 230 L 980 170 L 1150 170" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.35" />

  <!-- Subtle Floating Particles in background -->
  <circle class="particle" cx="280" cy="70" r="2.5" fill="#38bdf8" />
  <circle class="particle" cx="890" cy="80" r="3" fill="#a855f7" style="animation-delay: 2s;" />
  <circle class="particle" cx="720" cy="280" r="2" fill="#34d399" style="animation-delay: 4s;" />

  <!-- Dynamic Foreground Right Interactive Badge / Card (Visual Sandbox Simulator) -->
  <g transform="translate(830, 48)" filter="url(#soft-shadow)">
    <!-- Card Frame -->
    <rect width="320" height="240" rx="14" fill="url(#glow-card)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Header Bar -->
    <rect width="320" height="38" rx="14" fill="#1e293b" fill-opacity="0.9" />
    <circle cx="22" cy="19" r="5" fill="#ef4444" />
    <circle cx="38" cy="19" r="5" fill="#f59e0b" />
    <circle cx="54" cy="19" r="5" fill="#10b981" />
    <text x="75" y="23" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">STAGING GATEWAY SIMULATOR</text>
    
    <!-- Status Pill -->
    <rect x="220" y="10" width="85" height="18" rx="9" fill="#065f46" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
    <circle class="beacon" cx="232" cy="19" r="3.5" fill="#10b981" />
    <text x="242" y="23" font-family="-apple-system, sans-serif" font-size="9.5" fill="#34d399" font-weight="700">TEST MODE</text>

    <!-- Code / Event Feed Lines -->
    <g transform="translate(20, 58)">
      <text x="0" y="12" class="code-text" fill="#64748b">&gt; POST /v1/subscriptions/preview</text>
      <text x="0" y="32" class="code-text" fill="#38bdf8">{ "status": "simulated_success",</text>
      <text x="14" y="50" class="code-text" fill="#cbd5e1">  "proration_clock": "2026-11-11",</text>
      <text x="14" y="68" class="code-text" fill="#a78bfa">  "test_card": "4242••••••••4242",</text>
      <text x="14" y="86" class="code-text" fill="#34d399">  "dunning_action": "pass_zero_loss"</text>
      <text x="0" y="104" class="code-text" fill="#38bdf8">}</text>
    </g>

    <!-- Simulated Live Status Indicators -->
    <g transform="translate(20, 180)">
      <rect width="85" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">LATENCY</text>
      <text x="12" y="33" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">0 ms</text>

      <rect x="95" y="0" width="85" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="107" y="18" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">REAL MONEY</text>
      <text x="107" y="33" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#10b981">$0.00</text>

      <rect x="190" y="0" width="90" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="200" y="18" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">FAILURES</text>
      <text x="200" y="33" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f59e0b">INJECTED</text>
    </g>
  </g>

  <!-- Clear Foreground Content Block (Left & Center, Non-overlapping) -->
  <g transform="translate(70, 70)">
    <!-- Tag Pill -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="14" y="17" class="tag-text" fill="#60a5fa">🛡️ DEVELOPER ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="65" class="title-text">
      Sandbox &amp; Staging <tspan fill="url(#accent-cyan)">Billing Environment</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="105" class="subtitle-text">
      A curated collection of SaaS sandboxes, stateful offline mock engines,
    </text>
    <text x="0" y="130" class="subtitle-text">
      and open-source tooling for risk-free subscription &amp; payment lifecycle testing.
    </text>

    <!-- Feature Value Badges -->
    <g transform="translate(0, 160)">
      <!-- Pill 1 -->
      <g>
        <rect width="185" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="17" r="5" fill="#3b82f6" />
        <text x="34" y="22" class="badge-text">⚡ Zero Financial Risk</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(198, 0)">
        <rect width="195" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="17" r="5" fill="#10b981" />
        <text x="34" y="22" class="badge-text">⏱️ Time Simulation / Dunning</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(406, 0)">
        <rect width="190" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="17" r="5" fill="#ec4899" />
        <text x="34" y="22" class="badge-text">🧪 Failure Injections</text>
      </g>
    </g>
  </g>
</svg>
